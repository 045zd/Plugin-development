<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习通截止提醒</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <rect x="3" y="4" width="18" height="17" rx="3"></rect>
          <path d="M8 2v4M16 2v4M3 9h18"></path>
          <path d="M12 13v3l2 1"></path>
        </svg>
      </span>
      <h1 class="app-title">学习通截止提醒</h1>
      <div id="loginBadge" class="badge badge-unknown">
        <span class="badge-dot" aria-hidden="true"></span>
        <span id="loginBadgeText">状态未知</span>
        <a id="loginLink" class="badge-link" href="https://passport2.chaoxing.com/login" target="_blank" rel="noopener noreferrer" hidden>去登录</a>
      </div>
    </div>
    <p class="subline">
      <span id="lastCheck">上次检查：—</span>
      <span id="scanMetaLine"></span>
    </p>
  </header>

  <div class="toolbar">
    <button id="scanBtn" class="btn btn-primary" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
        <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span id="scanBtnText">立即检查</span>
    </button>
    <button id="optionsBtn" class="btn btn-secondary" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>设置</span>
    </button>
  </div>

  <div id="scanWarning" class="notice notice-warn" role="status" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
    <span id="scanWarningText"></span>
  </div>

  <main class="content">
    <div id="loadingView" class="state-view">
      <span class="spinner" aria-hidden="true"></span>
      <p class="state-title">正在读取监控状态…</p>
    </div>

    <div id="errorView" class="state-view" hidden>
      <span class="state-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </span>
      <p class="state-title">读取状态失败</p>
      <p id="errorText" class="state-desc"></p>
      <div class="state-actions">
        <button id="retryBtn" class="btn btn-primary" type="button">重试</button>
        <button id="errorOptionsBtn" class="btn btn-secondary" type="button">打开设置</button>
      </div>
    </div>

    <div id="emptyView" class="state-view" hidden>
      <span class="state-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
      </span>
      <p id="emptyTitle" class="state-title">暂无数据</p>
      <p id="emptyDesc" class="state-desc"></p>
      <div class="state-actions">
        <button id="emptyScanBtn" class="btn btn-primary" type="button">立即检查</button>
        <a id="emptyLoginLink" class="btn btn-secondary btn-link" href="https://passport2.chaoxing.com/login" target="_blank" rel="noopener noreferrer" hidden>去登录</a>
      </div>
    </div>

    <div id="listView" hidden>
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">待办<span id="todoCount" class="count"></span></h2>
        </div>
        <p id="todoEmpty" class="list-empty" hidden>没有待办项。</p>
        <ul id="todoList" class="item-list"></ul>
      </section>

      <section id="expiredSection" class="section" hidden>
        <button id="expiredToggle" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="expiredList">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
          <span id="expiredTitle">已截止/时间未知的未交项 0 项</span>
        </button>
        <ul id="expiredList" class="item-list" hidden></ul>
      </section>

      <section id="doneSection" class="section" hidden>
        <button id="doneToggle" class="collapse-toggle" type="button" aria-expanded="false" aria-controls="doneList">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
          <span id="doneTitle">已完成的 0 项</span>
        </button>
        <ul id="doneList" class="item-list" hidden></ul>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="app-footer">
    <span>仅截止提醒，不自动答题</span>
    <span class="version" id="popupVersion">v1.2.21</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
